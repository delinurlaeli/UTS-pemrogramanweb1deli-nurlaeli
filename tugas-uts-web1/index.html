<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toko Buku Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <h2>📚 Toko Buku Online</h2>
        <p class="subtitle">Silakan login untuk masuk ke dashboard</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="admin@bookstore.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <div class="login-links">
            <a href="#" id="forgotBtn">Lupa Password?</a>
            <a href="#" id="registerBtn">Daftar Akun</a>
        </div>

        <div class="student-info">
            <p><strong>Nama:</strong> Deli Nurlaeli</p>
            <p><strong>NIM:</strong> 312510061 | <strong>Kelas:</strong> I252A</p>
        </div>
    </div>

    <!-- Modal Lupa Password -->
    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeForgot">&times;</span>
            <h3>Reset Password</h3>
            <p>Masukkan email Anda untuk instruksi pemulihan:</p>
            <input type="email" id="resetEmail" placeholder="email@example.com" class="form-control mt-3">
            <button id="submitReset" class="btn btn-primary btn-block mt-3">Kirim Instruksi</button>
        </div>
    </div>

    <!-- Modal Daftar -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeRegister">&times;</span>
            <h3>Daftar Akun Baru</h3>
            <form id="registerForm" class="mt-3">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="regName" required class="form-control">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" required class="form-control">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required class="form-control">
                </div>
                <button type="submit" class="btn btn-success btn-block">Daftar Sekarang</button>
            </form>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
